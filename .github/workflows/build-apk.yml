name: Build APK

# Builds a debug APK and attaches it to a rolling "dev-build" prerelease, so it can be
# downloaded and installed directly from a phone browser with no toolchain locally.
#
# Debug, not release, on purpose: debug APKs are signed with Android's standard debug key
# and will install. An unsigned release APK will not. F-Droid signs its own release builds
# with its own key, so nothing here affects that.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Gradle wrapper jar is deliberately not committed (F-Droid supplies its own),
      # so bring Gradle in directly rather than running ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/circuit-clock-debug.apk

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: circuit-clock-debug-apk
          path: out/circuit-clock-debug.apk
          if-no-files-found: error

      - name: Publish to the dev-build prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-build --yes --cleanup-tag || true
          gh release create dev-build out/circuit-clock-debug.apk \
            --prerelease \
            --title "Latest debug build" \
            --notes "Debug APK built automatically from \`main\` (${{ github.sha }}).

          On your phone, open this page and tap \`circuit-clock-debug.apk\`. Android will
          ask you to allow installing unknown apps from your browser the first time.

          This is a development build, not a release. It is not the F-Droid build."
