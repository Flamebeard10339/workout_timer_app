name: Build APK

# Builds a debug APK and attaches it to a rolling "dev-build" prerelease, so it can be
# downloaded and installed directly from a phone browser with no toolchain locally.
#
# Debug, not release, on purpose: debug APKs are signed with Android's standard debug key
# and will install. An unsigned release APK will not. F-Droid signs its own release builds
# with its own key, so nothing here affects that.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The APK bundles a copy of the root HTML file. The Gradle build deliberately does
      # not copy it at build time (writing into a source directory that the asset-merge
      # task also reads is an undeclared producer/consumer overlap, which Gradle 8 rejects
      # — and build-time file shuffling is the sort of thing F-Droid reviewers query).
      # So the copy is committed, and drift is caught here instead.
      - name: Bundled asset matches the root file
        run: cmp workout-timer.html app/src/main/assets/workout-timer.html

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The Gradle wrapper jar is deliberately not committed (F-Droid supplies its own),
      # so bring Gradle in directly rather than running ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # Actions logs are not readable without signing in; the job summary is. On failure,
      # put enough of the error in the summary to diagnose it from the run page.
      - name: Report failure in the job summary
        if: failure()
        run: |
          {
            echo '## Gradle build failed'
            echo
            echo '### Error lines'
            echo '```'
            grep -nE 'FAILURE:|What went wrong|Execution failed|error:|e: |Caused by:|^\s+> ' build.log \
              | head -60 || echo '(no matching lines)'
            echo '```'
            echo
            echo '### Last 120 lines'
            echo '```'
            tail -120 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/circuit-clock-debug.apk

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: circuit-clock-debug-apk
          path: out/circuit-clock-debug.apk
          if-no-files-found: error

      - name: Publish to the dev-build prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-build --yes --cleanup-tag || true
          gh release create dev-build out/circuit-clock-debug.apk \
            --prerelease \
            --title "Latest debug build" \
            --notes "Debug APK built automatically from \`main\` (${{ github.sha }}).

          On your phone, open this page and tap \`circuit-clock-debug.apk\`. Android will
          ask you to allow installing unknown apps from your browser the first time.

          This is a development build, not a release. It is not the F-Droid build."
