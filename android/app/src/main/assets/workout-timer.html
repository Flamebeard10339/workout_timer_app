<style>
/* ---------------------------------------------------------------
   Tokens. Dark is the default world (a gym clock lives in the dark);
   light is the override for all three viewer states.
   --------------------------------------------------------------- */
:root{
  --bg:#10151B;
  --bg-2:#131A22;
  --surface:#1A2430;
  --surface-2:#212D3B;
  --line:#2B3846;
  --line-2:#3A4B5C;
  --text:#E6EDF4;
  --dim:#93A3B3;
  --faint:#6A7A8A;
  --accent:#F0A03C;
  --accent-ink:#20140A;
  --danger:#E5675B;
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 10px 26px rgba(0,0,0,.42);
  --indent:22px;
  --r:12px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EBEFF4;
    --bg-2:#E1E7EE;
    --surface:#FFFFFF;
    --surface-2:#F3F6FA;
    --line:#D4DCE5;
    --line-2:#B7C4D1;
    --text:#121920;
    --dim:#566573;
    --faint:#7E8D9C;
    --accent:#A9600D;
    --accent-ink:#FFF6EA;
    --danger:#B23528;
    --shadow:0 1px 2px rgba(16,28,40,.06), 0 8px 22px rgba(16,28,40,.10);
  }
}
:root[data-theme="light"]{
  --bg:#EBEFF4;
  --bg-2:#E1E7EE;
  --surface:#FFFFFF;
  --surface-2:#F3F6FA;
  --line:#D4DCE5;
  --line-2:#B7C4D1;
  --text:#121920;
  --dim:#566573;
  --faint:#7E8D9C;
  --accent:#A9600D;
  --accent-ink:#FFF6EA;
  --danger:#B23528;
  --shadow:0 1px 2px rgba(16,28,40,.06), 0 8px 22px rgba(16,28,40,.10);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;font-variant-numeric:tabular-nums}
.eyebrow{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
}
.screen{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:640px;margin:0 auto;padding:0 16px}

/* ---------------- shared controls ---------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:0 16px;border-radius:10px;
  background:var(--surface);border:1px solid var(--line);
  font-weight:600;letter-spacing:.01em;
  transition:background .14s ease,border-color .14s ease,transform .08s ease;
}
.btn:active{transform:translateY(1px)}
.btn:hover{background:var(--surface-2);border-color:var(--line-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:40px;height:40px;border-radius:10px;color:var(--dim);
  border:1px solid transparent;flex:0 0 auto;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--line)}
.icon-btn svg{width:18px;height:18px;display:block}
svg{stroke-linecap:round;stroke-linejoin:round}

/* ---------------- library ---------------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  width:100%;max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
  display:flex;align-items:center;gap:12px;
}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.brand h1{
  margin:0;font-family:'Archivo',system-ui,sans-serif;font-weight:800;
  font-size:21px;letter-spacing:-.02em;line-height:1.1;
}
.sync{display:inline-flex;align-items:center;gap:5px;color:var(--faint);min-width:0;white-space:nowrap;overflow:hidden}
.sync svg{width:12px;height:12px;flex:0 0 auto}
.sync span{overflow:hidden;text-overflow:ellipsis}
main.pad{flex:1;padding:20px 0 40px}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.card{
  display:flex;align-items:stretch;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--shadow);
}
.card-strip{width:6px;flex:0 0 6px;display:flex;flex-direction:column}
.card-strip i{flex:1;display:block}
.card-open{flex:1;min-width:0;text-align:left;padding:14px 4px 14px 14px;display:flex;flex-direction:column;gap:5px}
.card-open h2{
  margin:0;font-family:'Archivo',system-ui,sans-serif;font-weight:700;font-size:18px;
  letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
.card-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--line-2)}
.tag{
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 6px;border-radius:5px;border:1px solid var(--line-2);color:var(--faint);
}
.card-actions{display:flex;align-items:center;padding-right:8px;gap:2px}

.empty{
  text-align:center;padding:56px 20px;border:1px dashed var(--line-2);border-radius:var(--r);
  color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:14px;
}
.empty h2{margin:0;font-family:'Archivo',sans-serif;font-size:18px;color:var(--text)}
.empty p{margin:0;max-width:34ch;font-size:14px}
</style>
<style>
/* ---------------- editor ---------------- */
.name-field{
  flex:1;min-width:0;background:transparent;border:0;padding:4px 0;
  font-family:'Archivo',system-ui,sans-serif;font-weight:800;font-size:clamp(17px,4.8vw,20px);letter-spacing:-.02em;
  border-bottom:1px solid transparent;
}
.name-field:focus{outline:none;border-bottom-color:var(--accent)}
.stats{display:flex;gap:8px;align-items:center;color:var(--dim);font-size:13px;padding:2px 0 12px}
.stats b{color:var(--text);font-weight:600}
.stats .dot{width:3px;height:3px;border-radius:50%;background:var(--line-2)}

#tree{position:relative;display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
.row{
  position:relative;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  display:flex;flex-direction:column;
  transition:box-shadow .15s ease,opacity .15s ease;
}
.row::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  border-radius:10px 0 0 10px;background:var(--rail,var(--line-2));
}
.row.loop{background:var(--surface-2);border-style:dashed}
.row.lifted{opacity:.92;box-shadow:0 14px 34px rgba(0,0,0,.5);z-index:5}
.row.lifted-child{opacity:.5}
.row-top{display:flex;align-items:center;gap:6px;padding:8px 6px 8px 10px}
.grip{
  width:38px;height:40px;display:flex;align-items:center;justify-content:center;
  color:var(--faint);border-radius:8px;flex:0 0 auto;
  touch-action:none;cursor:grab;
}
.grip:hover{color:var(--text);background:var(--bg-2)}
.grip:active{cursor:grabbing}
.grip svg{width:16px;height:16px}
.swatch{
  width:26px;height:26px;border-radius:8px;flex:0 0 auto;
  border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.22);
}
.node-name{
  flex:1;min-width:0;background:transparent;border:0;padding:8px 2px;
  font-weight:600;font-size:16px;border-bottom:1px solid transparent;
}
.node-name:focus{outline:none;border-bottom-color:var(--accent)}
.row.loop .node-name{font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:.005em}
.row-bot{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:0 6px 8px 10px;
}
.stepper{
  display:inline-flex;align-items:center;background:var(--bg-2);
  border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:0 0 auto;
}

<script>
(function () {
'use strict';

/* ═══════════════ constants & helpers ═══════════════ */

const PALETTE = [
  { n: 'Ember',    c: '#B3382F' },
  { n: 'Rust',     c: '#A8571E' },
  { n: 'Brass',    c: '#7E6412' },
  { n: 'Moss',     c: '#3C6B45' },
  { n: 'Teal',     c: '#1F6B75' },
  { n: 'Cobalt',   c: '#2C5AA8' },
  { n: 'Plum',     c: '#6A3D8F' },
  { n: 'Graphite', c: '#41505E' }
];
const STORE_KEY = 'circuitclock.v1';
const MAX_STEPS = 2000;
const MAX_DUR   = 5999;
const RING_C    = 2 * Math.PI * 92;

const $  = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function safeColor(c) {
  return /^#[0-9a-fA-F]{6}$/.test(c || '') ? c : PALETTE[7].c;
}
function fmtClock(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const p = n => String(n).padStart(2, '0');
  return h ? h + ':' + p(m) + ':' + p(s) : m + ':' + p(s);
}
function parseDur(str, fallback) {
  const t = String(str == null ? '' : str).trim().toLowerCase();
  if (!t) return fallback;
  let m;
  if ((m = t.match(/^(\d+):(\d{1,2})$/)))            return clamp(+m[1] * 60 + +m[2], 1, MAX_DUR);
  if ((m = t.match(/^(\d+)\s*m\w*\s*(\d+)?\s*s?$/))) return clamp(+m[1] * 60 + (+m[2] || 0), 1, MAX_DUR);

}

/* Optional native host. The Android wrapper injects window.AndroidHost; in a plain

const host = (function () {
  const h = window.AndroidHost;
  return (h && typeof h.speak === 'function') ? h : null;
})();

const ICON = {
  grip:  '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
  dup:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>',
  del:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  plus:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  play:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8V4z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>',
  redo:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>',
  volOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  volLow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>',
  volOff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M17 9.5l4 5M21 9.5l-4 5"/></svg>'
};

/* ═══════════════ model ═══════════════ */

function newSection(i) {
  return { id: uid(), type: 'section', name: 'Work', color: PALETTE[i % PALETTE.length].c, duration: 45 };
}
function newLoop(i) {
  return { id: uid(), type: 'loop', name: 'Round', color: PALETTE[i % PALETTE.length].c, reps: 3, children: [] };
}
function countNodes(nodes) {
  let n = 0;
  (function walk(a) { for (const x of a) { n++; if (x.children) walk(x.children); } })(nodes || []);
  return n;
}
function flatten(nodes, depth, parentId, out) {
  depth = depth || 0; parentId = parentId || null; out = out || [];
  for (const node of nodes || []) {
    out.push({ node: node, depth: depth, parentId: parentId });
    if (node.type === 'loop') flatten(node.children || [], depth + 1, node.id, out);
  }

}
function findNode(nodes, id) {
  for (const n of nodes || []) {
    if (n.id === id) return n;
    if (n.children) { const f = findNode(n.children, id); if (f) return f; }
  }

}
function removeNode(nodes, id) {
  for (let i = 0; i < (nodes || []).length; i++) {
    if (nodes[i].id === id) return nodes.splice(i, 1)[0];
    if (nodes[i].children) { const r = removeNode(nodes[i].children, id); if (r) return r; }

function cloneNode(n) {
  const c = JSON.parse(JSON.stringify(n));
  (function re(x) { x.id = uid(); (x.children || []).forEach(re); })(c);

}
function childrenOf(parentId) {
  if (!parentId) return editing.nodes;
  const p = findNode(editing.nodes, parentId);
  if (!p) return editing.nodes;
  if (!p.children) p.children = [];
  return p.children;
}

/** Expand the tree into the flat run schedule, one entry per interval. */
function compile(w) {
  const steps = [];
  let overflow = false;
  (function walk(nodes, trail) {
    for (const n of nodes || []) {
      if (steps.length >= MAX_STEPS) { overflow = true; return; }
      if (n.type === 'section') {
        const d = clamp(Math.round(n.duration) || 1, 1, MAX_DUR);
        const name = (n.name || '').trim() || 'Section';
        const color = safeColor(n.color);
        steps.push({
          name: name, color: color, duration: d,
          trail: trail.concat([{ kind: 'section', name: name, color: color, dur: d }])
        });
      } else {
        const reps = clamp(Math.round(n.reps) || 1, 1, 99);
        const name = (n.name || '').trim() || 'Loop';
        const color = safeColor(n.color);
        for (let i = 1; i <= reps; i++) {
          walk(n.children || [], trail.concat([
            { kind: 'loop', id: n.id, name: name, color: color, iter: i, total: reps }
          ]));
          if (overflow) return;
        }
      }

  return { steps: steps, overflow: overflow };
}
function summary(w) {
  const r = compile(w);
  let total = 0;
  for (const s of r.steps) total += s.duration;
  return { steps: r.steps, total: total, overflow: r.overflow };
}

/* ═══════════════ storage ═══════════════ */

let state = { workouts: [], vol: 0.7, voice: true, seeded: false };

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {

  const v = Number(state.vol);
  state.vol = isNaN(v) ? 0.7 : clamp(v, 0, 1);
  // purge any sync tombstones left behind by an earlier build
  state.workouts = state.workouts.filter(w => w && w.id && !w.deleted);
}
function saveLocal() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}
function visible() {
  return state.workouts.slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
}
function touch(w) {
  w.updatedAt = Date.now();
  saveLocal();
}
function maybeSeed() {
  if (state.seeded) return;
  state.seeded = true;
  if (state.workouts.length) { saveLocal(); return; }
  const now = Date.now();
  const C = {};
  PALETTE.forEach(p => { C[p.n] = p.c; });
  state.workouts.push({
    id: 'example-tabata', example: true, updatedAt: now, name: 'Tabata — Core',
    nodes: [
      { id: uid(), type: 'section', name: 'Warm-up', color: C.Graphite, duration: 120 },
      { id: uid(), type: 'loop', name: 'Tabata', color: C.Cobalt, reps: 8, children: [
        { id: uid(), type: 'section', name: 'Hollow hold', color: C.Ember, duration: 20 },
        { id: uid(), type: 'section', name: 'Rest',        color: C.Teal,  duration: 10 }
      ] },
      { id: uid(), type: 'section', name: 'Cool-down', color: C.Moss, duration: 120 }
    ]
  });
  state.workouts.push({
    id: 'example-ladder', example: true, updatedAt: now - 1, name: 'EMOM Ladder — Full Body',
    nodes: [
      { id: uid(), type: 'section', name: 'Warm-up', color: C.Graphite, duration: 180 },
      { id: uid(), type: 'loop', name: 'Block', color: C.Plum, reps: 3, children: [
        { id: uid(), type: 'loop', name: 'Minute', color: C.Cobalt, reps: 5, children: [
          { id: uid(), type: 'section', name: 'Work',  color: C.Ember, duration: 40 },
          { id: uid(), type: 'section', name: 'Reset', color: C.Teal,  duration: 20 }
        ] },
        { id: uid(), type: 'section', name: 'Block rest', color: C.Moss, duration: 90 }
      ] },
      { id: uid(), type: 'section', name: 'Cool-down', color: C.Graphite, duration: 120 }

/* ═══════════════ screens ═══════════════ */

let screenName = 'library';
let editing = null;

function show(name) {
  screenName = name;
  $('#scr-library').hidden = name !== 'library';
  $('#scr-editor').hidden  = name !== 'editor';
  $('#scr-runner').hidden  = name !== 'runner';
  window.scrollTo(0, 0);
}
function toast(msg) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.setAttribute('role', 'status');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3400);
}

/* ── library ─────────────────────────── */

function renderLibrary() {
  const list = $('#workoutList');
  const items = visible();
  if (!items.length) {
    list.innerHTML =
      '<li class="empty">' +
        '<h2>No workouts yet</h2>' +
        '<p>Build one from timed sections, then wrap groups of them in loops to repeat rounds.</p>' +
        '<button class="btn primary" data-act="new">Create a workout</button>' +
      '</li>';
    return;
  }
  list.innerHTML = items.map(w => {
    const s = summary(w);
    const colors = [];
    for (const st of s.steps) { if (colors.indexOf(st.color) < 0) colors.push(st.color); if (colors.length >= 6) break; }
    const strip = (colors.length ? colors : ['#41505E'])
      .map(c => '<i style="background:' + esc(c) + '"></i>').join('');
    return '<li class="card">' +
      '<span class="card-strip" aria-hidden="true">' + strip + '</span>' +
      '<button class="card-open" data-act="open" data-id="' + esc(w.id) + '">' +
        '<h2>' + esc(w.name || 'Untitled workout') + '</h2>' +
        '<span class="card-meta">' +
          '<span class="mono">' + fmtClock(s.total) + '</span>' +
          '<span class="dot"></span>' +
          '<span>' + s.steps.length + ' interval' + (s.steps.length === 1 ? '' : 's') + '</span>' +
          (w.example ? '<span class="dot"></span><span class="tag">Example</span>' : '') +
        '</span>' +
      '</button>' +
      '<span class="card-actions">' +
        '<button class="icon-btn" data-act="dup" data-id="' + esc(w.id) + '" aria-label="Duplicate ' + esc(w.name) + '" title="Duplicate">' + ICON.dup + '</button>' +
        '<button class="icon-btn" data-act="del" data-id="' + esc(w.id) + '" aria-label="Delete ' + esc(w.name) + '" title="Delete">' + ICON.del + '</button>' +
      '</span>' +
    '</li>';
  }).join('');
}

function createWorkout() {
  const w = {
    id: uid(), name: 'New workout', updatedAt: Date.now(),
    nodes: [
      { id: uid(), type: 'section', name: 'Warm-up', color: PALETTE[7].c, duration: 60 },
      { id: uid(), type: 'loop', name: 'Round', color: PALETTE[5].c, reps: 3, children: [
        { id: uid(), type: 'section', name: 'Work', color: PALETTE[0].c, duration: 45 },
        { id: uid(), type: 'section', name: 'Rest', color: PALETTE[4].c, duration: 15 }
      ] }
    ]
  };
  state.workouts.push(w);
  touch(w);
  openEditor(w.id);
}
function deleteWorkout(id) {
  const w = state.workouts.find(x => x.id === id);
  if (!w) return;
  if (!confirm('Delete "' + (w.name || 'Untitled workout') + '"? This cannot be undone.')) return;
  state.workouts.splice(state.workouts.indexOf(w), 1);
  saveLocal();
  renderLibrary();
}

$('#workoutList').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === 'new') createWorkout();
  else if (act === 'open') openEditor(id);
  else if (act === 'del') deleteWorkout(id);
  else if (act === 'dup') {
    const src = state.workouts.find(x => x.id === id);
    if (!src) return;
    const copy = JSON.parse(JSON.stringify(src));
    copy.id = uid();
    copy.example = false;
    copy.name = (src.name || 'Untitled') + ' copy';
    copy.nodes = (src.nodes || []).map(cloneNode);
    state.workouts.push(copy);
    touch(copy);
    renderLibrary();
  }
});
$('#btnNew').addEventListener('click', createWorkout);

/* ── editor ──────────────────────────── */

function openEditor(id) {
  const w = state.workouts.find(x => x.id === id);
  if (!w) { renderLibrary(); return; }
  editing = w;
  if (!Array.isArray(editing.nodes)) editing.nodes = [];
  $('#workoutName').value = w.name || '';
  show('editor');
  renderTree();
  renderStats();
  history.pushState({ s: 'editor' }, '');
}
function leaveEditor() {
  editing = null;
  renderLibrary();
  show('library');
}
function renderStats() {
  if (!editing) return;
  const s = summary(editing);
  $('#editorStats').innerHTML =
    '<b class="mono">' + fmtClock(s.total) + '</b><span>total</span>' +
    '<span class="dot"></span>' +
    '<b>' + s.steps.length + '</b><span>interval' + (s.steps.length === 1 ? '' : 's') + '</span>' +
    (s.overflow ? '<span class="dot"></span><span style="color:var(--danger)">over ' + MAX_STEPS + ' — trim a loop</span>' : '');
}
function rowEl(id) { return document.querySelector('.row[data-id="' + id + '"]'); }

function stepperHTML(node) {
  if (node.type === 'loop') {
    return '<div class="stepper reps">' +
        '<button data-act="minus" aria-label="Fewer rounds">&minus;</button>' +
        '<input data-act="reps" inputmode="numeric" value="' + (node.reps || 1) + '" aria-label="Rounds">' +
        '<button data-act="plus" aria-label="More rounds">+</button>' +
      '</div><span class="unit">rounds</span>';
  }
  return '<div class="stepper">' +
      '<button data-act="minus" aria-label="Shorter">&minus;</button>' +
      '<input data-act="dur" inputmode="numeric" value="' + fmtClock(node.duration || 1) + '" aria-label="Duration">' +
      '<button data-act="plus" aria-label="Longer">+</button>' +
    '</div><span class="unit">min:sec</span>';
}
function rowHTML(f) {
  const n = f.node;
  const color = safeColor(n.color);
  return '<div class="row ' + (n.type === 'loop' ? 'loop' : 'section') + '" data-id="' + esc(n.id) + '" ' +
      'style="margin-left:calc(var(--indent) * ' + Math.min(f.depth, 6) + ');--rail:' + esc(color) + '">' +
    '<div class="row-top">' +
      '<button class="grip" data-act="grip" aria-label="Reorder ' + esc(n.name) + '. Arrow keys move it." title="Drag to reorder and nest">' + ICON.grip + '</button>' +
      '<button class="swatch" data-act="color" style="background:' + esc(color) + '" aria-label="Colour for ' + esc(n.name) + '" title="Colour"></button>' +
      '<input class="node-name" data-act="name" value="' + esc(n.name) + '" maxlength="40" ' +
        'placeholder="' + (n.type === 'loop' ? 'Loop name' : 'Section name') + '" aria-label="Name">' +
    '</div>' +
    '<div class="row-bot">' +
      stepperHTML(n) +
      '<span class="spacer"></span>' +
      (n.type === 'loop'
        ? '<button class="icon-btn" data-act="addin" aria-label="Add a section inside ' + esc(n.name) + '" title="Add inside">' + ICON.plus + '</button>'
        : '') +
      '<button class="icon-btn" data-act="dup" aria-label="Duplicate ' + esc(n.name) + '" title="Duplicate">' + ICON.dup + '</button>' +
      '<button class="icon-btn" data-act="del" aria-label="Delete ' + esc(n.name) + '" title="Delete">' + ICON.del + '</button>' +
    '</div>' +
  '</div>';
}
function renderTree() {
  const tree = $('#tree');
  const flat = flatten(editing.nodes);
  if (!flat.length) {
    tree.innerHTML = '<div class="child-hint">Nothing here yet — add a section below, then wrap sections in a loop to repeat them.</div>';
    return;
  }
  let html = '';
  for (const f of flat) {
    html += rowHTML(f);
    if (f.node.type === 'loop' && !(f.node.children || []).length) {
      html += '<div class="child-hint" style="margin-left:calc(var(--indent) * ' + Math.min(f.depth + 1, 6) + ')">Empty loop — add a section inside it.</div>';
    }
  }
  tree.innerHTML = html;
}

$('#workoutName').addEventListener('input', e => {
  if (!editing) return;
  editing.name = e.target.value;
  touch(editing);
});
$('#btnBack').addEventListener('click', () => history.back());
$('#btnDeleteWorkout').addEventListener('click', () => {
  if (!editing) return;
  const id = editing.id;
  const name = editing.name;
  if (!confirm('Delete "' + (name || 'Untitled workout') + '"? This cannot be undone.')) return;
  const i = state.workouts.findIndex(x => x.id === id);
  if (i >= 0) state.workouts.splice(i, 1);
  editing = null;
  saveLocal();
  history.back();
});
$('#btnAddSection').addEventListener('click', () => {
  editing.nodes.push(newSection(countNodes(editing.nodes)));
  touch(editing); renderTree(); renderStats();
});
$('#btnAddLoop').addEventListener('click', () => {

  touch(editing); renderTree(); renderStats();
});
$('#btnStart').addEventListener('click', () => startRun(editing, 'editor'));

$('#tree').addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.act !== 'name') return;
  const row = t.closest('.row');
  const node = findNode(editing.nodes, row.dataset.id);
  if (!node) return;
  node.name = t.value;
  touch(editing);
});
$('#tree').addEventListener('change', e => {
  const t = e.target;
  const row = t.closest('.row');
  if (!row) return;
  const node = findNode(editing.nodes, row.dataset.id);
  if (!node) return;
  if (t.dataset.act === 'dur') {
    node.duration = parseDur(t.value, node.duration || 45);
    t.value = fmtClock(node.duration);
  } else if (t.dataset.act === 'reps') {
    node.reps = clamp(parseInt(String(t.value).replace(/\D/g, ''), 10) || 1, 1, 99);
    t.value = node.reps;
  } else return;
  touch(editing); renderStats();
});
$('#tree').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const row = b.closest('.row');
  if (!row) return;
  const id = row.dataset.id;
  const node = findNode(editing.nodes, id);
  if (!node) return;
  const act = b.dataset.act;

  if (act === 'minus' || act === 'plus') {
    const dir = act === 'plus' ? 1 : -1;
    if (node.type === 'loop') {
      node.reps = clamp((node.reps || 1) + dir, 1, 99);
      row.querySelector('[data-act="reps"]').value = node.reps;
    } else {
      const step = (node.duration || 45) < 20 && dir < 0 ? 1 : 5;
      node.duration = clamp((node.duration || 45) + dir * step, 1, MAX_DUR);
      row.querySelector('[data-act="dur"]').value = fmtClock(node.duration);
    }
    touch(editing); renderStats();
  } else if (act === 'color') {
    openPalette(b, node, row);
  } else if (act === 'addin') {
    if (!node.children) node.children = [];
    node.children.push(newSection(countNodes(editing.nodes)));
    touch(editing); renderTree(); renderStats();
  } else if (act === 'dup') {
    const f = flatten(editing.nodes).find(x => x.node.id === id);
    const arr = f.parentId ? findNode(editing.nodes, f.parentId).children : editing.nodes;
    arr.splice(arr.indexOf(node) + 1, 0, cloneNode(node));
    touch(editing); renderTree(); renderStats();
  } else if (act === 'del') {
    const kids = (node.children || []).length;
    if (kids && !confirm('Delete "' + (node.name || 'this loop') + '" and the ' + kids + ' item' + (kids === 1 ? '' : 's') + ' inside it?')) return;
    removeNode(editing.nodes, id);
    touch(editing); renderTree(); renderStats();
  }
});

/* colour popover */
let pop = null;
function closePalette() {
  if (pop) { pop.remove(); pop = null; }
  document.removeEventListener('pointerdown', outsidePalette, true);
}
function outsidePalette(e) { if (pop && !pop.contains(e.target)) closePalette(); }
function openPalette(anchor, node, row) {
  closePalette();
  const p = document.createElement('div');
  p.className = 'pop';
  p.setAttribute('role', 'radiogroup');
  p.setAttribute('aria-label', 'Section colour');
  p.innerHTML = PALETTE.map(c =>
    '<button role="radio" aria-checked="' + (c.c === node.color) + '" aria-label="' + c.n +
    '" data-c="' + c.c + '" style="background:' + c.c + '"></button>').join('');
  document.body.appendChild(p);
  const r = anchor.getBoundingClientRect();
  const w = p.offsetWidth, h = p.offsetHeight;
  p.style.left = clamp(r.left - 8, 8, window.innerWidth - w - 8) + 'px';
  p.style.top = (r.bottom + 8 + h > window.innerHeight ? Math.max(8, r.top - 8 - h) : r.bottom + 8) + 'px';
  p.addEventListener('click', ev => {
    const b = ev.target.closest('button[data-c]');
    if (!b) return;
    node.color = b.dataset.c;
    touch(editing);
    row.style.setProperty('--rail', node.color);
    const sw = row.querySelector('.swatch');
    if (sw) sw.style.background = node.color;
    closePalette();
  });
  pop = p;
  setTimeout(() => document.addEventListener('pointerdown', outsidePalette, true), 0);
}

/* ── drag to reorder & nest ──────────── */

let drag = null;

function moveNode(id, parentId, pos) {
  const node = removeNode(editing.nodes, id);
  if (!node) return;
  const arr = childrenOf(parentId);
  arr.splice(clamp(pos, 0, arr.length), 0, node);
  touch(editing);
  renderTree();
  renderStats();
}

$('#tree').addEventListener('pointerdown', e => {
  const g = e.target.closest('.grip');
  if (!g || drag) return;
  e.preventDefault();
  const row = g.closest('.row');
  startDrag(e, row.dataset.id, g);
});

function startDrag(e, id, grip) {
  const flat = flatten(editing.nodes);
  const me = flat.find(f => f.node.id === id);
  if (!me) return;
  const sub = new Set();
  (function collect(n) { sub.add(n.id); (n.children || []).forEach(collect); })(me.node);

  drag = {
    id: id, pointerId: e.pointerId, indent: indentPx(),
    items: flat.filter(f => !sub.has(f.node.id)),
    baseDepth: me.depth,
    startX: e.clientX, startPageY: e.clientY + window.scrollY,
    x: e.clientX, y: e.clientY,
    els: [], proj: null
  };
  for (const f of flat) {
    if (!sub.has(f.node.id)) continue;
    const el = rowEl(f.node.id);
    if (el) { el.classList.add(f.node.id === id ? 'lifted' : 'lifted-child'); drag.els.push(el); }
  }
  drag.line = document.createElement('div');
  drag.line.className = 'drop-line';
  document.body.appendChild(drag.line);
  document.body.classList.add('dragging');
  try { grip.setPointerCapture(e.pointerId); } catch (err) {}
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragUp);
  window.addEventListener('pointercancel', onDragCancel);
  drag.raf = requestAnimationFrame(dragFrame);
  updateDrag();
}
function onDragMove(e) {
  if (!drag || e.pointerId !== drag.pointerId) return;
  e.preventDefault();
  drag.x = e.clientX;
  drag.y = e.clientY;
}
function onDragUp(e) { if (drag && e.pointerId === drag.pointerId) endDrag(true); }
function onDragCancel(e) { if (drag && e.pointerId === drag.pointerId) endDrag(false); }

function dragFrame() {
  if (!drag) return;
  const edge = 90;
  if (drag.y < edge) window.scrollBy(0, -Math.ceil((edge - drag.y) / 6));
  else if (drag.y > window.innerHeight - edge) window.scrollBy(0, Math.ceil((drag.y - (window.innerHeight - edge)) / 6));
  updateDrag();
  drag.raf = requestAnimationFrame(dragFrame);
}
function updateDrag() {
  const rects = [];
  for (const f of drag.items) {
    const el = rowEl(f.node.id);
    if (!el) continue;
    const r = el.getBoundingClientRect();
    rects.push({ id: f.node.id, top: r.top, bottom: r.bottom, mid: (r.top + r.bottom) / 2,
                 depth: f.depth, type: f.node.type, parentId: f.parentId });
  }
  let over = rects.findIndex(r => drag.y < r.mid);
  if (over < 0) over = rects.length;

  const prev = rects[over - 1], next = rects[over];
  const maxD = prev ? (prev.type === 'loop' ? prev.depth + 1 : prev.depth) : 0;
  const minD = next ? next.depth : 0;
  const want = drag.baseDepth + Math.round((drag.x - drag.startX) / drag.indent);
  const depth = clamp(want, Math.min(minD, maxD), maxD);

  let parentId = null;
  if (depth > 0) {
    for (let i = over - 1; i >= 0; i--) {
      if (rects[i].depth === depth - 1) { parentId = rects[i].id; break; }
    }
  }
  let pos = 0;
  for (let i = 0; i < over; i++) if (rects[i].parentId === parentId) pos++;
  drag.proj = { parentId: parentId, pos: pos, depth: depth };

  const treeR = $('#tree').getBoundingClientRect();
  const left = treeR.left + depth * drag.indent;
  const y = over < rects.length ? rects[over].top - 4
          : (rects.length ? rects[rects.length - 1].bottom + 1 : treeR.top);
  drag.line.style.top = y + 'px';
  drag.line.style.left = left + 'px';
  drag.line.style.width = Math.max(48, treeR.right - left) + 'px';

  const dy = (drag.y + window.scrollY) - drag.startPageY;
  const dx = (depth - drag.baseDepth) * drag.indent;
  for (const el of drag.els) el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
}
function endDrag(commit) {
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragUp);
  window.removeEventListener('pointercancel', onDragCancel);
  cancelAnimationFrame(drag.raf);
  drag.line.remove();
  drag.els.forEach(el => { el.classList.remove('lifted', 'lifted-child'); el.style.transform = ''; });
  document.body.classList.remove('dragging');
  const proj = drag.proj, id = drag.id;
  drag = null;
  if (commit && proj) moveNode(id, proj.parentId, proj.pos);
  else { renderTree(); renderStats(); }
}

/* keyboard reordering, for anyone not dragging */
$('#tree').addEventListener('keydown', e => {
  const g = e.target.closest('.grip');
  if (!g) return;
  const keys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
  if (keys.indexOf(e.key) < 0) return;
  e.preventDefault();
  const id = g.closest('.row').dataset.id;
  const f = flatten(editing.nodes).find(x => x.node.id === id);
  if (!f) return;
  const sibs = childrenOf(f.parentId);
  const i = sibs.findIndex(n => n.id === id);
  const gp = f.parentId ? flatten(editing.nodes).find(x => x.node.id === f.parentId) : null;

  if (e.key === 'ArrowUp') {
    if (i > 0) {
      const above = sibs[i - 1];
      if (above.type === 'loop') moveNode(id, above.id, (above.children || []).length);
      else moveNode(id, f.parentId, i - 1);
    } else if (gp) moveNode(id, gp.parentId, childrenOf(gp.parentId).findIndex(n => n.id === gp.node.id));
  } else if (e.key === 'ArrowDown') {
    if (i < sibs.length - 1) {
      const below = sibs[i + 1];
      if (below.type === 'loop') moveNode(id, below.id, 0);
      else moveNode(id, f.parentId, i + 1);
    } else if (gp) moveNode(id, gp.parentId, childrenOf(gp.parentId).findIndex(n => n.id === gp.node.id) + 1);
  } else if (e.key === 'ArrowRight') {
    if (i > 0 && sibs[i - 1].type === 'loop') moveNode(id, sibs[i - 1].id, (sibs[i - 1].children || []).length);
  } else if (e.key === 'ArrowLeft') {
    if (gp) moveNode(id, gp.parentId, childrenOf(gp.parentId).findIndex(n => n.id === gp.node.id) + 1);
  }
  const el = rowEl(id);
  if (el) el.querySelector('.grip').focus();
});

/* ═══════════════ audio cues ═══════════════ */

let ac = null, master = null, volTier = null;

function audioInit() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  try {
    ac = new Ctx();
    master = ac.createGain();
    master.gain.value = state.vol;
    master.connect(ac.destination);
  } catch (e) { ac = null; }
}
function tone(freq, dur, peak, type) {
  if (!ac || !master || state.vol <= 0) return;
  const t = ac.currentTime + 0.005;
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + 0.014);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(master);
  osc.start(t); osc.stop(t + dur + 0.04);
}
const cueSoft   = () => tone(660, 0.14, 0.14);
const cueGo     = () => { tone(990, 0.45, 0.55); tone(1485, 0.30, 0.13, 'triangle'); };
const cueFinish = () => {
  tone(784, 0.18, 0.40);
  setTimeout(() => tone(988, 0.18, 0.42), 190);
  setTimeout(() => tone(1319, 0.70, 0.55), 380);
};

function stopSpeech() {
  if (host) { try { host.stopSpeaking(); return; } catch (e) {} }
  try { window.speechSynthesis.cancel(); } catch (e) {}
}
function speak(text) {
  if (!state.voice || !text) return;
  if (host) { try { host.speak(String(text), clamp(state.vol, 0, 1)); return; } catch (e) {} }
  if (!('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.volume = clamp(state.vol, 0, 1);
    u.rate = 1.05;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function paintVolume() {
  const pct = Math.round(state.vol * 100);
  $('#volRange').value = pct;
  $('#volNum').textContent = pct + '%';
  const tier = pct === 0 ? 'volOff' : (pct < 55 ? 'volLow' : 'volOn');
  if (tier !== volTier) {
    volTier = tier;
    const cur = $('#volIcon');
    const holder = document.createElement('div');
    holder.innerHTML = ICON[tier];
    const next = holder.firstElementChild;
    next.id = 'volIcon';
    cur.replaceWith(next);
  }
}
$('#volRange').addEventListener('input', e => {
  state.vol = clamp(Number(e.target.value) / 100, 0, 1);
  if (master) master.gain.value = state.vol;
  paintVolume();
  saveLocal();
});
$('#volRange').addEventListener('change', () => { audioInit(); cueSoft(); });
$('#btnVoice').addEventListener('click', () => {
  state.voice = !state.voice;
  $('#btnVoice').setAttribute('aria-pressed', String(state.voice));
  saveLocal();
  if (state.voice && run) speak(run.steps[run.i].name);
  else stopSpeech();
});

/* ═══════════════ wake lock ═══════════════ */

let wake = null;
async function requestWake() {
  if (host) { try { host.keepAwake(true); } catch (e) {} }
  try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch (e) {}
}
function releaseWake() {
  if (host) { try { host.keepAwake(false); } catch (e) {} }
  try { if (wake) { wake.release(); wake = null; } } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (ac && ac.state === 'suspended') ac.resume();
  if (run && !run.done && !run.paused) requestWake();
});

/* ═══════════════ runner ═══════════════ */

let run = null;

function startRun(w, from) {
  if (!w) return;
  const s = summary(w);
  if (!s.steps.length) { toast('Add at least one section before starting.'); return; }
  if (s.overflow) { toast('This expands past ' + MAX_STEPS + ' intervals. Lower a round count first.'); return; }

  audioInit();
  stopSpeech();
  // Browsers need speech primed inside a user gesture; the native host does not.
  if (!host) { try { window.speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); } catch (e) {} }

  run = { w: w, from: from || 'library', steps: s.steps, total: s.total, i: 0,
          paused: false, done: false, cued: 99, shown: -1, endAt: 0, remainAt: 0 };
  run.endAt = performance.now() + s.steps[0].duration * 1000;

  $('#runTitle').textContent = w.name || 'Workout';
  show('runner');
  history.pushState({ s: 'runner' }, '');
  paintStep(true);
  paintTime(s.steps[0].duration, s.steps[0].duration);
  updatePlayBtn();
  requestWake();
  startTimers();
}
function startTimers() {
  stopTimers();
  run.raf = requestAnimationFrame(function frame() {
    if (!run) return;
    run.raf = requestAnimationFrame(frame);
    tick();
  });
  run.iv = setInterval(tick, 250);
}
function stopTimers() {
  if (!run) return;
  if (run.raf) cancelAnimationFrame(run.raf);
  if (run.iv) clearInterval(run.iv);
  run.raf = run.iv = null;
}
function elapsedBefore(i) {
  let t = 0;
  for (let k = 0; k < i; k++) t += run.steps[k].duration;
  return t;
}

function tick() {
  if (!run || run.done || run.paused) return;
  let remain = (run.endAt - performance.now()) / 1000;

  while (remain <= 0) {
    // A gap wider than a second means the tab was asleep: catch up silently.
    const catchingUp = -remain > 1.2;
    if (!catchingUp) cueGo();
    if (run.i >= run.steps.length - 1) { finish(); return; }
    run.i++;
    run.endAt += run.steps[run.i].duration * 1000;
    run.cued = 99;
    paintStep(!catchingUp);
    remain = (run.endAt - performance.now()) / 1000;
  }

  const secs = Math.max(0, Math.ceil(remain - 0.0001));
  if (secs !== run.shown) { run.shown = secs; paintTime(secs, remain); }
  if ((secs === 2 || secs === 1) && run.cued > secs) { run.cued = secs; cueSoft(); }
}

function paintStep(announce) {
  const step = run.steps[run.i];
  $('#scr-runner').style.setProperty('--glow', step.color);
  $('#runSub').textContent =
    (run.i + 1) + ' / ' + run.steps.length + '  ·  ' +
    fmtClock(elapsedBefore(run.i)) + ' / ' + fmtClock(run.total);

  $('#trail').innerHTML = step.trail.map((t, i) => {
    const cur = i === step.trail.length - 1;
    const right = t.kind === 'loop' ? t.iter + '/' + t.total : fmtClock(t.dur);
    return '<div class="trail-bar' + (cur ? ' cur' : '') + '" style="background:' + esc(t.color) + '">' +
             '<span class="tn">' + esc(t.name) + '</span>' +
             '<span class="tc">' + right + '</span>' +
           '</div>';
  }).join('');

  const nx = run.steps[run.i + 1];
  const nu = $('#nextUp');
  nu.className = 'next-up';
  nu.innerHTML = nx
    ? 'Next &nbsp;<b>' + esc(nx.name) + '</b>&nbsp; ' + fmtClock(nx.duration)
    : 'Final section';

  run.shown = -1;
  if (announce) speak(announceText());
}
function announceText() {
  const step = run.steps[run.i];
  const prev = run.steps[run.i - 1];
  const name = step.name;
  if (prev) {
    const a = prev.trail.filter(t => t.kind === 'loop');
    const b = step.trail.filter(t => t.kind === 'loop');
    for (let k = 0; k < b.length; k++) {
      const before = a[k];
      if (!before || before.id !== b[k].id || before.iter !== b[k].iter) {
        if (b[k].total > 1) return b[k].name + ' ' + b[k].iter + '. ' + name;
        break;
      }
    }
  }
  return name;
}
function paintTime(secs, remain) {
  const big = $('#bigTime');
  big.textContent = secs >= 60 ? fmtClock(secs) : String(secs);
  big.classList.toggle('warn', secs <= 3);
  $('#dialLabel').textContent = run.paused ? 'paused'
    : (secs >= 60 ? 'remaining' : (secs === 1 ? 'second left' : 'seconds left'));
  const frac = clamp(remain / run.steps[run.i].duration, 0, 1);
  const ring = $('#progRing');
  ring.style.strokeDasharray = RING_C;
  ring.style.strokeDashoffset = RING_C * (1 - frac);
}
function updatePlayBtn() {
  const b = $('#btnPlay');
  if (!run) return;
  const label = run.done ? 'Run again' : (run.paused ? 'Resume' : 'Pause');
  b.innerHTML = run.done ? ICON.redo : (run.paused ? ICON.play : ICON.pause);
  b.setAttribute('aria-label', label);
  b.title = label;
}
function setPaused(p) {
  if (!run || run.done) return;
  if (p) {
    run.remainAt = run.endAt - performance.now();
    run.paused = true;
    stopTimers();
    releaseWake();
    stopSpeech();
    paintTime(Math.max(0, Math.ceil(run.remainAt / 1000 - 0.0001)), run.remainAt / 1000);
  } else {
    audioInit();
    run.endAt = performance.now() + run.remainAt;
    run.paused = false;
    run.shown = -1;   // the next tick repaints only when the second changes; force it now
    requestWake();
    startTimers();
  }
  updatePlayBtn();
}
function jump(delta) {
  if (!run) return;
  const step = run.steps[run.i];
  const spent = step.duration - (run.paused ? run.remainAt / 1000 : (run.endAt - performance.now()) / 1000);
  let target = run.i + delta;
  if (delta < 0 && !run.done && spent > 2) target = run.i;      // first press restarts this section
  target = clamp(target, 0, run.steps.length - 1);

  run.i = target;
  run.done = false;
  run.cued = 99;
  const ms = run.steps[target].duration * 1000;
  if (run.paused) run.remainAt = ms;
  else { run.endAt = performance.now() + ms; startTimers(); }
  paintStep(true);
  paintTime(run.steps[target].duration, run.steps[target].duration);
  updatePlayBtn();
}
function finish() {
  run.done = true;
  stopTimers();
  releaseWake();
  cueFinish();
  speak('Workout complete');
  $('#bigTime').textContent = '0';
  $('#bigTime').classList.remove('warn');
  $('#dialLabel').textContent = 'complete';
  $('#progRing').style.strokeDashoffset = RING_C;
  const nu = $('#nextUp');
  nu.className = 'next-up done-note';
  nu.textContent = 'Done · ' + fmtClock(run.total) + ' · ' + run.steps.length + ' intervals';
  $('#runSub').textContent = run.steps.length + ' / ' + run.steps.length + '  ·  ' + fmtClock(run.total) + ' / ' + fmtClock(run.total);
  updatePlayBtn();
}
function restart() {
  if (!run) return;
  audioInit();
  run.i = 0; run.done = false; run.paused = false; run.cued = 99;
  run.endAt = performance.now() + run.steps[0].duration * 1000;
  paintStep(true);
  paintTime(run.steps[0].duration, run.steps[0].duration);
  updatePlayBtn();
  requestWake();
  startTimers();
}
function exitRun() {
  if (run) { stopTimers(); }
  stopSpeech();
  releaseWake();
  const from = run ? run.from : 'library';
  run = null;
  if (from === 'editor' && editing) {
    show('editor');
    renderTree();
    renderStats();
  } else {
    renderLibrary();
    show('library');
  }
}

$('#btnPlay').addEventListener('click', () => {
  if (!run) return;
  if (run.done) restart(); else setPaused(!run.paused);
});
$('#btnPrev').addEventListener('click', () => jump(-1));
$('#btnNext').addEventListener('click', () => jump(1));
$('#btnExit').addEventListener('click', () => history.back());

document.addEventListener('keydown', e => {
  if (screenName !== 'runner' || !run) return;
  if (e.target.matches('input, textarea')) return;
  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    if (run.done) restart(); else setPaused(!run.paused);
  } else if (e.key === 'ArrowRight') { e.preventDefault(); jump(1); }
  else if (e.key === 'ArrowLeft')    { e.preventDefault(); jump(-1); }
  else if (e.key === 'Escape')       { history.back(); }
});

/* ═══════════════ boot ═══════════════ */

window.addEventListener('popstate', () => {
  if (screenName === 'runner') exitRun();
  else if (screenName === 'editor') leaveEditor();
});

loadLocal();
maybeSeed();
paintVolume();
$('#btnVoice').setAttribute('aria-pressed', String(!!state.voice));
renderLibrary();
show('library');

})();
</script>

</body>
</html>
